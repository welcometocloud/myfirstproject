<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color"
      content="#020617">

<title>Daily Vocabulary</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #334155,
            transparent 45%
        ),
        radial-gradient(
            circle at bottom right,
            #1e3a8a,
            transparent 45%
        ),
        #020617;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.header-title {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: .65;
    font-weight: 600;
}

.card {
    min-height: 570px;

    padding: 32px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.35);

    display: flex;
    flex-direction: column;
}

.category {
    align-self: flex-start;

    padding: 7px 13px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.10);

    font-size: 11px;

    letter-spacing: 1px;

    opacity: .75;
}

.word {
    font-size:
        clamp(48px,10vw,76px);

    line-height: 1;

    font-weight: 800;

    letter-spacing: -2px;

    margin-top: 35px;
    margin-bottom: 12px;

    word-break: break-word;
}

.phonetic {
    font-size: 18px;
    opacity: .6;
    margin-bottom: 25px;
}

.part {
    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    opacity: .6;

    margin-bottom: 10px;
}

.definition {
    font-size: 22px;

    line-height: 1.45;

    margin-bottom: 22px;
}

.example {
    font-size: 17px;

    line-height: 1.5;

    opacity: .7;

    border-left:
        3px solid
        rgba(255,255,255,.35);

    padding-left: 15px;

    margin-bottom: 22px;
}

.label {
    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: .4;

    margin-bottom: 6px;
}

.words {
    font-size: 15px;

    line-height: 1.5;

    opacity: .7;
}

.bottom {
    margin-top: auto;

    padding-top: 25px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.counter {
    font-size: 11px;
    opacity: .4;
}

button {
    border: 0;

    color: white;

    background:
        rgba(255,255,255,.12);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 17px;

    padding:
        12px 18px;

    font-size: 14px;

    font-weight: 600;

    margin-left: 7px;
}

button:active {
    transform: scale(.94);
}

.audio {
    width: 46px;
    height: 46px;

    padding: 0;

    font-size: 20px;
}

.loading {
    opacity: .45;
}

.error {
    color: #fca5a5;
}

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .card {
        min-height: 600px;

        padding: 25px;

        border-radius: 25px;
    }

    .definition {
        font-size: 20px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="header-title">
            DAILY VOCABULARY
        </div>

    </div>


    <div class="card">


        <div
            id="category"
            class="category">

            RANDOM WORD

        </div>


        <div
            id="word"
            class="word">

            Loading...

        </div>


        <div
            id="phonetic"
            class="phonetic">

            Finding vocabulary...

        </div>


        <div
            id="part"
            class="part">

        </div>


        <div
            id="definition"
            class="definition">

            <span class="loading">
                Finding definition...
            </span>

        </div>


        <div
            id="example"
            class="example">

        </div>


        <div
            id="synonymBox"
            style="display:none">

            <div class="label">
                SYNONYMS
            </div>

            <div
                id="synonyms"
                class="words">

            </div>

        </div>


        <div
            id="antonymBox"
            style="display:none; margin-top:15px">

            <div class="label">
                ANTONYMS
            </div>

            <div
                id="antonyms"
                class="words">

            </div>

        </div>


        <div class="bottom">


            <div
                id="counter"
                class="counter">

                LIVE DICTIONARY

            </div>


            <div>

                <button
                    id="audioButton"
                    class="audio"
                    onclick="playAudio()"
                    style="display:none">

                    🔊

                </button>


                <button
                    onclick="loadNewWord()">

                    Next →

                </button>

            </div>


        </div>

    </div>

</div>


<script>

/*
========================================================
API
========================================================
*/

const RANDOM_WORD_API =
    "https://random-words-api.vercel.app/word/english/vocabulary";

const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";

const ROTATION_TIME = 30000;


/*
========================================================
STATE
========================================================
*/

let currentAudio = null;

let loading = false;

let shownWords =
    JSON.parse(
        localStorage.getItem(
            "shownWords"
        ) || "[]"
    );


/*
========================================================
ELEMENTS
========================================================
*/

const wordElement =
    document.getElementById("word");

const phoneticElement =
    document.getElementById("phonetic");

const partElement =
    document.getElementById("part");

const definitionElement =
    document.getElementById("definition");

const exampleElement =
    document.getElementById("example");

const synonymsElement =
    document.getElementById("synonyms");

const antonymsElement =
    document.getElementById("antonyms");

const synonymBox =
    document.getElementById("synonymBox");

const antonymBox =
    document.getElementById("antonymBox");

const audioButton =
    document.getElementById("audioButton");

const counterElement =
    document.getElementById("counter");


/*
========================================================
RANDOM WORD API
========================================================
*/

async function getRandomWord() {

    const response =
        await fetch(
            RANDOM_WORD_API
        );

    if (!response.ok) {

        throw new Error(
            "Random word API failed"
        );

    }

    const data =
        await response.json();


    /*
    Expected format:

    [
        {
            word: "..."
        }
    ]
    */

    if (
        Array.isArray(data) &&
        data.length > 0 &&
        data[0].word
    ) {

        return data[0].word;

    }


    /*
    Fallback if API returns object.
    */

    if (data.word) {

        return data.word;

    }


    throw new Error(
        "Invalid random word response"
    );

}


/*
========================================================
DICTIONARY API
========================================================
*/

async function getDictionaryData(word) {

    const cacheKey =
        "dictionary_" +
        word.toLowerCase();


    /*
    Use cached definition first.
    */

    const cached =
        localStorage.getItem(
            cacheKey
        );


    if (cached) {

        try {

            return JSON.parse(cached);

        } catch (error) {

            localStorage.removeItem(
                cacheKey
            );

        }

    }


    /*
    Call dictionary API.
    */

    const response =
        await fetch(
            DICTIONARY_API +
            encodeURIComponent(word)
        );


    if (!response.ok) {

        throw new Error(
            "Dictionary entry not found"
        );

    }


    const data =
        await response.json();


    /*
    Cache definition locally.
    */

    localStorage.setItem(
        cacheKey,
        JSON.stringify(data)
    );


    return data;

}


/*
========================================================
LOAD NEW WORD
========================================================
*/

async function loadNewWord() {

    if (loading)
        return;

    loading = true;


    /*
    Reset UI.
    */

    wordElement.textContent =
        "Loading...";

    phoneticElement.textContent =
        "Finding vocabulary...";

    partElement.textContent =
        "";

    definitionElement.innerHTML = `
        <span class="loading">
            Finding definition...
        </span>
    `;

    exampleElement.textContent =
        "";

    synonymBox.style.display =
        "none";

    antonymBox.style.display =
        "none";

    audioButton.style.display =
        "none";

    currentAudio = null;


    try {


        /*
        ==================================================
        KEEP TRYING UNTIL A VALID DICTIONARY WORD IS FOUND
        ==================================================
        */

        for (
            let attempt = 0;
            attempt < 15;
            attempt++
        ) {


            /*
            Get random word.
            */

            const word =
                await getRandomWord();


            if (!word)
                continue;


            /*
            Avoid immediate duplicates.
            */

            if (
                shownWords.includes(
                    word.toLowerCase()
                )
            ) {

                continue;

            }


            /*
            Ask dictionary API.
            */

            let data;

            try {

                data =
                    await getDictionaryData(
                        word
                    );

            } catch (error) {

                /*
                Word isn't available
                in dictionary.

                Try another word.
                */

                continue;

            }


            /*
            Validate dictionary response.
            */

            if (
                !Array.isArray(data) ||
                !data.length ||
                !data[0].meanings
            ) {

                continue;

            }


            const entry =
                data[0];


            /*
            ==================================================
            FIND FIRST REAL DEFINITION
            ==================================================
            */

            let meaning = null;

            let definition = null;


            for (
                const m
                of entry.meanings
            ) {


                for (
                    const d
                    of (m.definitions || [])
                ) {


                    if (
                        d.definition
                    ) {

                        meaning = m;

                        definition = d;

                        break;

                    }

                }


                if (definition)
                    break;

            }


            /*
            No usable definition?
            Try another word.
            */

            if (!definition)
                continue;


            /*
            ==================================================
            VALID WORD FOUND
            ==================================================
            */


            /*
            Save word to history.
            */

            shownWords.push(
                word.toLowerCase()
            );


            /*
            Keep last 100 words.
            */

            if (
                shownWords.length > 100
            ) {

                shownWords =
                    shownWords.slice(-100);

            }


            localStorage.setItem(
                "shownWords",
                JSON.stringify(
                    shownWords
                )
            );


            /*
            WORD
            */

            wordElement.textContent =
                word;


            /*
            PART OF SPEECH
            */

            partElement.textContent =
                meaning.partOfSpeech ||
                "";


            /*
            ==================================================
            PRONUNCIATION
            ==================================================
            */

            let phonetic =
                entry.phonetic || "";


            if (
                !phonetic &&
                entry.phonetics
            ) {


                const phoneticEntry =
                    entry.phonetics.find(
                        item =>
                            item.text
                    );


                if (phoneticEntry) {

                    phonetic =
                        phoneticEntry.text;

                }

            }


            phoneticElement.textContent =
                phonetic ||
                "Pronunciation unavailable";


            /*
            ==================================================
            AUDIO
            ==================================================
            */

            if (
                entry.phonetics
            ) {


                const audioEntry =
                    entry.phonetics.find(
                        item =>
                            item.audio
                    );


                if (audioEntry) {


                    currentAudio =
                        audioEntry.audio;


                    if (
                        currentAudio.startsWith(
                            "//"
                        )
                    ) {

                        currentAudio =
                            "https:" +
                            currentAudio;

                    }


                    audioButton.style.display =
                        "inline-flex";

                }

            }


            /*
            ==================================================
            DEFINITION
            ==================================================
            */

            definitionElement.textContent =
                definition.definition;


            /*
            ==================================================
            EXAMPLE
            ==================================================
            */

            if (
                definition.example
            ) {

                exampleElement.textContent =
                    `"${definition.example}"`;

            }


            /*
            ==================================================
            SYNONYMS
            ==================================================
            */

            let synonyms =
                meaning.synonyms || [];


            /*
            Search definitions too.
            */

            if (
                synonyms.length === 0
            ) {


                for (
                    const d
                    of meaning.definitions || []
                ) {


                    if (
                        d.synonyms &&
                        d.synonyms.length
                    ) {

                        synonyms.push(
                            ...d.synonyms
                        );

                    }

                }

            }


            synonyms =
                [...new Set(synonyms)];


            if (
                synonyms.length
            ) {


                synonymsElement.textContent =
                    synonyms
                        .slice(0,8)
                        .join(" • ");


                synonymBox.style.display =
                    "block";

            }


            /*
            ==================================================
            ANTONYMS
            ==================================================
            */

            let antonyms =
                meaning.antonyms || [];


            antonyms =
                [...new Set(antonyms)];


            if (
                antonyms.length
            ) {


                antonymsElement.textContent =
                    antonyms
                        .slice(0,8)
                        .join(" • ");


                antonymBox.style.display =
                    "block";

            }


            /*
            SUCCESS
            */

            counterElement.textContent =
                "LIVE DICTIONARY";


            return;

        }


        /*
        ==================================================
        15 ATTEMPTS FAILED
        ==================================================
        */

        throw new Error(
            "No valid dictionary word found"
        );


    }

    catch (error) {


        console.log(
            "Vocabulary error:",
            error
        );


        definitionElement.innerHTML = `
            <div class="error">
                Trying to find another word...
            </div>
        `;


        /*
        Automatically retry.
        */

        setTimeout(
            loadNewWord,
            1000
        );


    }

    finally {

        loading = false;

    }

}


/*
========================================================
AUDIO
========================================================
*/

function playAudio() {

    if (!currentAudio)
        return;


    const audio =
        new Audio(
            currentAudio
        );


    audio.play()
        .catch(
            error =>
                console.log(
                    "Audio error:",
                    error
                )
        );

}


/*
========================================================
AUTOMATIC WORD CHANGE
========================================================
*/

setInterval(
    loadNewWord,
    ROTATION_TIME
);


/*
========================================================
START
========================================================
*/

loadNewWord();

</script>

</body>

</html>
