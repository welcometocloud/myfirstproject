<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0f172a">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="Vocabulary">

<title>Daily Vocabulary</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc 45%,
            #e0f2fe
        );

    color: #0f172a;

    padding: 18px;
}

.app {

    width: 100%;

    max-width: 700px;

    margin: auto;
}


/* HEADER */

.header {

    text-align: center;

    padding:
        8px
        0
        20px;
}

.logo {

    font-size: 38px;

    margin-bottom: 4px;
}

.title {

    font-size: 30px;

    font-weight: 800;

    letter-spacing: -0.8px;
}

.subtitle {

    color: #64748b;

    font-size: 14px;

    margin-top: 5px;
}


/* MAIN CARD */

.card {

    background:
        rgba(255,255,255,0.92);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(255,255,255,0.9);

    border-radius: 30px;

    padding: 26px 22px;

    box-shadow:
        0 25px 60px
        rgba(15,23,42,0.12);

}


/* WORD */

.word-area {

    text-align: center;

    padding:
        8px
        0
        24px;
}

.word {

    font-size:
        clamp(42px, 11vw, 66px);

    font-weight: 850;

    letter-spacing: -2.5px;

    line-height: 1.05;

    overflow-wrap: anywhere;
}

.phonetic {

    color: #64748b;

    font-size: 18px;

    margin-top: 10px;
}

.grammar {

    display: inline-block;

    margin-top: 11px;

    padding:
        6px
        13px;

    border-radius: 20px;

    background: #ede9fe;

    color: #6d28d9;

    font-size: 12px;

    font-weight: 800;

    text-transform: uppercase;
}


/* INFORMATION CARDS */

.info-card {

    margin-top: 14px;

    padding: 18px;

    border-radius: 20px;

    background: #f8fafc;

    border:
        1px solid
        #e2e8f0;
}

.info-card.definition-card {

    background:
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );

    border-color: #e0e7ff;
}

.info-card.hindi-card {

    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #fffbeb
        );

    border-color: #fed7aa;
}

.info-card.example-card {

    background:
        linear-gradient(
            135deg,
            #f0fdf4,
            #f8fafc
        );

    border-color: #bbf7d0;
}


.label {

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #64748b;

    margin-bottom: 10px;
}


/* DEFINITION */

.definition-list {

    margin: 0;

    padding-left: 22px;
}

.definition-item {

    padding-left: 5px;

    margin-bottom: 12px;

    font-size: 17px;

    line-height: 1.55;
}

.definition-item:last-child {

    margin-bottom: 0;
}


/* HINDI */

.hindi {

    font-size: 23px;

    font-weight: 650;

    line-height: 1.55;
}


/* EXAMPLE */

.example {

    font-size: 16px;

    line-height: 1.6;

    color: #475569;

    font-style: italic;
}


/* API STATUS */

.api-status {

    margin-top: 8px;

    font-size: 12px;

    color: #94a3b8;
}


/* LOADING */

.loading {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #64748b;

    font-size: 14px;
}

.dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #6366f1;

    animation:
        pulse 1s infinite alternate;
}

@keyframes pulse {

    from {
        opacity: .25;
    }

    to {
        opacity: 1;
    }

}


/* ACTIONS */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 22px;
}

button {

    border: 0;

    border-radius: 16px;

    padding: 15px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

button:active {

    transform:
        scale(.96);
}

.primary {

    background: #0f172a;

    color: white;
}

.secondary {

    background: #e2e8f0;

    color: #0f172a;
}


/* SEARCH */

.search {

    display: flex;

    gap: 9px;

    margin-top: 22px;
}

.search input {

    min-width: 0;

    flex: 1;

    border:
        1px solid
        #cbd5e1;

    background: white;

    border-radius: 15px;

    padding: 14px;

    font-size: 16px;

    outline: none;
}

.search input:focus {

    border-color:
        #6366f1;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);
}

.search button {

    background: #4f46e5;

    color: white;
}


/* ALPHABET */

.alphabet-title {

    margin-top: 24px;

    text-align: center;

    font-size: 11px;

    font-weight: 800;

    color: #64748b;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.alphabet {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 6px;

    margin-top: 10px;
}

.letter {

    width: 35px;

    height: 35px;

    padding: 0;

    border-radius: 10px;

    background: #e2e8f0;

    color: #334155;

    font-size: 13px;
}

.letter.active {

    background: #4f46e5;

    color: white;
}


/* FOOTER */

.status {

    text-align: center;

    margin-top: 17px;

    min-height: 20px;

    font-size: 13px;

    color: #64748b;
}

.count {

    text-align: center;

    margin-top: 5px;

    font-size: 12px;

    color: #94a3b8;
}

.timer {

    text-align: center;

    margin-top: 9px;

    font-size: 12px;

    color: #94a3b8;
}


/* MOBILE */

@media(max-width:500px) {

    body {
        padding: 10px;
    }

    .card {
        padding:
            22px
            16px;
    }

    .title {
        font-size: 26px;
    }

    .word {
        font-size: 43px;
    }

    .hindi {
        font-size: 21px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            📖
        </div>

        <div class="title">
            Daily Vocabulary
        </div>

        <div class="subtitle">
            Learn one word at a time
        </div>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- WORD -->

        <div class="word-area">

            <div
                class="word"
                id="word">

                Loading...

            </div>

            <div
                class="phonetic"
                id="phonetic">
            </div>

            <div
                class="grammar"
                id="grammar">
            </div>

        </div>


        <!-- ENGLISH DEFINITION -->

        <div
            class="info-card definition-card">

            <div class="label">
                📘 English Definition
            </div>

            <div id="definition">

                <div class="loading">

                    <span class="dot"></span>

                    Finding definition...

                </div>

            </div>

            <div
                class="api-status"
                id="apiStatus">
            </div>

        </div>


        <!-- HINDI -->

        <div
            class="info-card hindi-card">

            <div class="label">
                🇮🇳 Hindi Meaning
            </div>

            <div
                class="hindi"
                id="hindi">

                Loading...

            </div>

        </div>


        <!-- EXAMPLE -->

        <div
            class="info-card example-card">

            <div class="label">
                💬 Example
            </div>

            <div
                class="example"
                id="example">

                —

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                class="primary"
                onclick="newWord()">

                ✨ New Word

            </button>

            <button
                class="secondary"
                onclick="pronounce()">

                🔊 Listen

            </button>

        </div>


        <!-- SEARCH -->

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search English word..."
                autocomplete="off"
                onkeydown="handleSearchKey(event)"
            >

            <button
                onclick="searchWord()">

                Search

            </button>

        </div>


        <!-- A-Z -->

        <div class="alphabet-title">

            Browse A–Z

        </div>

        <div
            class="alphabet"
            id="alphabet">
        </div>


        <!-- STATUS -->

        <div
            class="status"
            id="status">

            Loading dictionary...

        </div>

        <div
            class="count"
            id="count">
        </div>

        <div
            class="timer"
            id="timer">
        </div>


    </div>

</div>


<script>


const WORDS_FILE =
    "./words.json";


const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";


let words = [];

let currentWord = null;

let currentLetter = null;

let audioURL = "";

let secondsRemaining = 30;


// ==================================================
// LOAD WORDS
// ==================================================

async function loadWords() {

    setStatus(
        "Loading vocabulary..."
    );

    try {

        const response =
            await fetch(
                WORDS_FILE +
                "?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "words.json error"
            );

        }


        words =
            await response.json();


        if (!Array.isArray(words)) {

            throw new Error(
                "Invalid words.json"
            );

        }


        document.getElementById(
            "count"
        ).textContent =

            words.length.toLocaleString() +
            " words available";


        buildAlphabet();


        setStatus("Ready");


        newWord();


    } catch(error) {

        console.error(error);

        setStatus(
            "Could not load vocabulary"
        );

    }

}


// ==================================================
// NEW WORD
// ==================================================

function newWord(
    letter = currentLetter
) {

    if (!words.length) {
        return;
    }


    currentLetter =
        letter;


    let available =
        words;


    if (currentLetter) {

        available =
            words.filter(
                item =>

                    item.word &&

                    item.word
                        .toLowerCase()
                        .startsWith(
                            currentLetter
                        )
            );

    }


    if (!available.length) {

        setStatus(
            "No words found"
        );

        return;

    }


    const index =
        Math.floor(
            Math.random() *
            available.length
        );


    currentWord =
        available[index];


    displayBasic(
        currentWord
    );


    getDictionaryData(
        currentWord.word
    );

}


// ==================================================
// DISPLAY LOCAL DATA
// ==================================================

function displayBasic(item) {

    document.getElementById(
        "word"
    ).textContent =
        item.word || "—";


    document.getElementById(
        "hindi"
    ).textContent =
        item.hindi ||
        "Hindi meaning unavailable";


    document.getElementById(
        "grammar"
    ).textContent =
        item.grammar || "";


    document.getElementById(
        "phonetic"
    ).textContent =
        "";


    document.getElementById(
        "definition"
    ).innerHTML =

        `<div class="loading">
            <span class="dot"></span>
            Finding definition...
        </div>`;


    document.getElementById(
        "example"
    ).textContent =
        "Finding example...";


    document.getElementById(
        "apiStatus"
    ).textContent =
        "";


    audioURL = "";

}


// ==================================================
// GET ENGLISH DEFINITION
// ==================================================

async function getDictionaryData(
    word
) {

    const cacheKey =
        "vocab_" +
        word.toLowerCase();


    // ----------------------------------------------
    // CACHE
    // ----------------------------------------------

    try {

        const cached =
            localStorage.getItem(
                cacheKey
            );


        if (cached) {

            const data =
                JSON.parse(
                    cached
                );


            if (
                currentWord &&
                currentWord.word.toLowerCase()
                === word.toLowerCase()
            ) {

                displayDictionary(
                    data
                );

                setStatus(
                    "⚡ Definition from cache"
                );

            }

            return;

        }

    } catch(error) {

        console.log(
            "Cache error",
            error
        );

    }


    // ----------------------------------------------
    // API
    // ----------------------------------------------

    try {

        const response =
            await fetch(
                DICTIONARY_API +
                encodeURIComponent(
                    word
                )
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        // User may have changed word
        if (
            !currentWord ||
            currentWord.word.toLowerCase()
            !== word.toLowerCase()
        ) {

            return;

        }


        try {

            localStorage.setItem(
                cacheKey,
                JSON.stringify(data)
            );

        } catch(error) {

            console.log(
                "Cache save failed"
            );

        }


        displayDictionary(
            data
        );


        setStatus(
            "Definition loaded"
        );


    } catch(error) {

        console.error(
            "API error:",
            error
        );


        showDefinitionFallback(
            word
        );

    }

}


// ==================================================
// DISPLAY DEFINITION
// ==================================================

function displayDictionary(
    data
) {

    if (
        !Array.isArray(data) ||
        !data.length
    ) {

        showDefinitionFallback(
            currentWord.word
        );

        return;

    }


    const entry =
        data[0];


    // ----------------------------------------------
    // PHONETIC
    // ----------------------------------------------

    let phonetic = "";


    if (entry.phonetic) {

        phonetic =
            entry.phonetic;

    } else if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const found =
            entry.phonetics.find(
                p => p.text
            );


        if (found) {

            phonetic =
                found.text;

        }

    }


    document.getElementById(
        "phonetic"
    ).textContent =
        phonetic;


    // ----------------------------------------------
    // AUDIO
    // ----------------------------------------------

    audioURL = "";


    if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const audio =
            entry.phonetics.find(
                p => p.audio
            );


        if (audio) {

            audioURL =
                audio.audio;

        }

    }


    // ----------------------------------------------
    // ALL DEFINITIONS
    // ----------------------------------------------

    let definitions = [];

    let example = "";

    let apiPartOfSpeech = "";


    if (
        entry.meanings &&
        entry.meanings.length
    ) {


        for (
            const meaning
            of entry.meanings
        ) {


            if (
                !apiPartOfSpeech &&
                meaning.partOfSpeech
            ) {

                apiPartOfSpeech =
                    meaning.partOfSpeech;

            }


            if (
                meaning.definitions
            ) {

                for (
                    const def
                    of meaning.definitions
                ) {

                    if (
                        def.definition
                    ) {

                        definitions.push(
                            def.definition
                        );

                    }


                    if (
                        !example &&
                        def.example
                    ) {

                        example =
                            def.example;

                    }

                }

            }

        }

    }


    // ----------------------------------------------
    // DEFINITION CARD
    // ----------------------------------------------

    const definitionElement =
        document.getElementById(
            "definition"
        );


    if (definitions.length) {

        // Maximum 3 definitions
        definitions =
            definitions.slice(
                0,
                3
            );


        definitionElement.innerHTML =

            `<ol class="definition-list">

                ${
                    definitions.map(
                        definition =>

                        `<li class="definition-item">
                            ${escapeHTML(
                                definition
                            )}
                        </li>`
                    ).join("")
                }

            </ol>`;


        document.getElementById(
            "apiStatus"
        ).textContent =
            definitions.length +
            " definition" +
            (
                definitions.length > 1
                    ? "s"
                    : ""
            );


    } else {

        showDefinitionFallback(
            currentWord.word
        );

    }


    // ----------------------------------------------
    // EXAMPLE
    // ----------------------------------------------

    document.getElementById(
        "example"
    ).textContent =

        example ||
        "No example sentence available.";


    // ----------------------------------------------
    // PART OF SPEECH
    // ----------------------------------------------

    if (
        !currentWord.grammar &&
        apiPartOfSpeech
    ) {

        document.getElementById(
            "grammar"
        ).textContent =
            apiPartOfSpeech;

    }

}


// ==================================================
// FALLBACK
// ==================================================

function showDefinitionFallback(
    word
) {

    document.getElementById(
        "definition"
    ).innerHTML =

        `<div class="definition">
            English definition is not available
            for this entry.
        </div>`;


    document.getElementById(
        "apiStatus"
    ).textContent =
        "Hindi meaning is available locally";


    document.getElementById(
        "example"
    ).textContent =
        "No example available.";


    setStatus(
        "Hindi meaning available"
    );

}


// ==================================================
// SEARCH
// ==================================================

function searchWord() {

    const input =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if (!input) {
        return;
    }


    const found =
        words.find(
            item =>
                item.word &&
                item.word
                    .toLowerCase() ===
                input
        );


    if (!found) {

        setStatus(
            "Word not found"
        );

        return;

    }


    currentWord =
        found;


    displayBasic(
        found
    );


    getDictionaryData(
        found.word
    );

}


function handleSearchKey(
    event
) {

    if (
        event.key === "Enter"
    ) {

        searchWord();

    }

}


// ==================================================
// ALPHABET
// ==================================================

function buildAlphabet() {

    const container =
        document.getElementById(
            "alphabet"
        );


    container.innerHTML = "";


    const all =
        document.createElement(
            "button"
        );


    all.className =
        "letter";


    all.textContent =
        "ALL";


    all.onclick = () => {

        currentLetter =
            null;

        updateActiveLetter();

        newWord(null);

    };


    container.appendChild(
        all
    );


    for (
        let i = 65;
        i <= 90;
        i++
    ) {

        const letter =
            String.fromCharCode(i);


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "letter";


        button.textContent =
            letter;


        button.dataset.letter =
            letter.toLowerCase();


        button.onclick = () => {

            currentLetter =
                letter.toLowerCase();


            updateActiveLetter();


            newWord(
                currentLetter
            );

        };


        container.appendChild(
            button
        );

    }

}


function updateActiveLetter() {

    document
        .querySelectorAll(
            ".letter"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );


                if (
                    currentLetter &&
                    button.dataset.letter
                    === currentLetter
                ) {

                    button.classList.add(
                        "active"
                    );

                }

            }
        );

}


// ==================================================
// PRONUNCIATION
// ==================================================

function pronounce() {

    if (!currentWord) {
        return;
    }


    if (audioURL) {

        const audio =
            new Audio(
                audioURL
            );


        audio.play()
            .catch(
                () => speakWord()
            );


        return;

    }


    speakWord();

}


function speakWord() {

    if (
        !("speechSynthesis" in window)
    ) {

        setStatus(
            "Speech not supported"
        );

        return;

    }


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            currentWord.word
        );


    speech.lang =
        "en-US";


    speech.rate =
        0.8;


    speechSynthesis.speak(
        speech
    );

}


// ==================================================
// SAFE HTML
// ==================================================

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


// ==================================================
// STATUS
// ==================================================

function setStatus(
    message
) {

    document.getElementById(
        "status"
    ).textContent =
        message;

}


// ==================================================
// TIMER
// ==================================================

setInterval(
    () => {

        secondsRemaining--;


        if (
            secondsRemaining <= 0
        ) {

            secondsRemaining =
                30;


            newWord(
                currentLetter
            );

        }


        document.getElementById(
            "timer"
        ).textContent =

            "Next word in " +
            secondsRemaining +
            " seconds";

    },
    1000
);


// ==================================================
// START
// ==================================================

loadWords();

</script>

</body>
</html>
