<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocabulary">

<title>Daily Vocabulary</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(circle at top, #dbeafe 0, #f8fafc 42%, #eef2ff 100%);

    color: #0f172a;
    padding: 18px;
}

.app {
    width: 100%;
    max-width: 680px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    padding: 12px 0 20px;
}

.logo {
    font-size: 38px;
    margin-bottom: 5px;
}

.title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.8px;
}

.subtitle {
    color: #64748b;
    font-size: 14px;
    margin-top: 5px;
}

/* MAIN CARD */

.card {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.8);

    border-radius: 28px;

    padding: 28px 24px;

    box-shadow:
        0 20px 50px rgba(15,23,42,0.10),
        0 3px 10px rgba(15,23,42,0.05);

    transition: transform 0.2s ease;
}

.card.changing {
    transform: scale(0.99);
}

/* WORD */

.word-area {
    text-align: center;
    padding: 8px 0 25px;
}

.word {
    font-size: clamp(40px, 10vw, 64px);
    font-weight: 850;
    letter-spacing: -2px;
    line-height: 1.05;
    overflow-wrap: anywhere;
}

.phonetic {
    color: #64748b;
    font-size: 19px;
    margin-top: 10px;
}

.grammar {
    display: inline-block;

    margin-top: 12px;

    padding: 5px 12px;

    border-radius: 20px;

    background: #ede9fe;
    color: #6d28d9;

    font-size: 13px;
    font-weight: 700;
}

/* SECTIONS */

.section {
    margin-top: 18px;
}

.section-card {
    background: #f8fafc;
    border-radius: 18px;
    padding: 18px;
}

.label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748b;
    margin-bottom: 8px;
}

.definition {
    font-size: 18px;
    line-height: 1.55;
    font-weight: 500;
}

.hindi {
    font-size: 23px;
    line-height: 1.5;
    font-weight: 600;
}

.example {
    color: #475569;
    font-size: 16px;
    line-height: 1.55;
    font-style: italic;
}

/* LOADING */

.loading-line {
    height: 18px;
    width: 75%;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #e2e8f0,
        #f8fafc,
        #e2e8f0
    );

    background-size: 200% 100%;

    animation: shimmer 1.4s infinite;
}

@keyframes shimmer {
    0% {
        background-position: 200% 0;
    }

    100% {
        background-position: -200% 0;
    }
}

/* BUTTONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 22px;
}

button {
    border: 0;
    border-radius: 16px;
    padding: 15px;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.12s ease,
        opacity 0.12s ease;
}

button:active {
    transform: scale(0.96);
}

.primary {
    background: #0f172a;
    color: white;
}

.secondary {
    background: #e2e8f0;
    color: #0f172a;
}

/* SEARCH */

.search {
    display: flex;
    gap: 9px;
    margin-top: 22px;
}

.search input {
    min-width: 0;
    flex: 1;

    border: 1px solid #cbd5e1;
    background: white;

    border-radius: 15px;

    padding: 14px;

    font-size: 16px;

    outline: none;
}

.search input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

.search button {
    background: #4f46e5;
    color: white;
    flex: 0 0 auto;
}

/* ALPHABET */

.alphabet-title {
    margin-top: 24px;
    text-align: center;

    font-size: 12px;
    font-weight: 800;

    color: #64748b;

    text-transform: uppercase;
    letter-spacing: 1px;
}

.alphabet {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;

    margin-top: 10px;
}

.letter {
    width: 35px;
    height: 35px;

    padding: 0;

    border-radius: 10px;

    background: #e2e8f0;
    color: #334155;

    font-size: 13px;
}

.letter.active {
    background: #4f46e5;
    color: white;
}

/* STATUS */

.status {
    text-align: center;

    margin-top: 18px;

    font-size: 13px;
    color: #64748b;

    min-height: 20px;
}

.count {
    text-align: center;

    margin-top: 5px;

    font-size: 12px;
    color: #94a3b8;
}

/* TIMER */

.timer {
    text-align: center;

    margin-top: 13px;

    font-size: 12px;
    color: #94a3b8;
}

/* MOBILE */

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 22px 17px;
        border-radius: 24px;
    }

    .title {
        font-size: 26px;
    }

    .word {
        font-size: 42px;
    }

    .definition {
        font-size: 17px;
    }

    .hindi {
        font-size: 21px;
    }

    .letter {
        width: 32px;
        height: 32px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="logo">📖</div>

        <div class="title">
            Daily Vocabulary
        </div>

        <div class="subtitle">
            Build your English • English → Hindi
        </div>

    </div>


    <div class="card" id="card">

        <!-- WORD -->

        <div class="word-area">

            <div class="word" id="word">
                Loading...
            </div>

            <div class="phonetic" id="phonetic"></div>

            <div class="grammar" id="grammar"></div>

        </div>


        <!-- ENGLISH -->

        <div class="section">

            <div class="section-card">

                <div class="label">
                    English Definition
                </div>

                <div class="definition" id="definition">

                    <div class="loading-line"></div>

                </div>

            </div>

        </div>


        <!-- HINDI -->

        <div class="section">

            <div class="section-card">

                <div class="label">
                    🇮🇳 Hindi Meaning
                </div>

                <div class="hindi" id="hindi">
                    Loading...
                </div>

            </div>

        </div>


        <!-- EXAMPLE -->

        <div class="section">

            <div class="section-card">

                <div class="label">
                    💬 Example
                </div>

                <div class="example" id="example">
                    —
                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                class="primary"
                onclick="newWord()">

                ✨ New Word

            </button>

            <button
                class="secondary"
                onclick="pronounce()">

                🔊 Listen

            </button>

        </div>


        <!-- SEARCH -->

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search English word..."
                autocomplete="off"
                onkeydown="handleSearchKey(event)"
            >

            <button onclick="searchWord()">
                Search
            </button>

        </div>


        <!-- ALPHABET -->

        <div class="alphabet-title">
            Browse A–Z
        </div>

        <div
            class="alphabet"
            id="alphabet">
        </div>


        <!-- STATUS -->

        <div
            class="status"
            id="status">

            Loading dictionary...

        </div>

        <div
            class="count"
            id="count">
        </div>

        <div
            class="timer"
            id="timer">
        </div>

    </div>

</div>


<script>

const WORDS_FILE = "./words.json";

const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";

let words = [];

let currentWord = null;

let currentLetter = null;

let audioURL = "";

let secondsRemaining = 30;


// --------------------------------------------------
// LOAD LOCAL DICTIONARY
// --------------------------------------------------

async function loadWords() {

    setStatus("Loading vocabulary...");

    try {

        const response =
            await fetch(
                WORDS_FILE + "?v=" + Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Could not load words.json"
            );

        }

        words =
            await response.json();

        if (!Array.isArray(words)) {

            throw new Error(
                "words.json must contain an array"
            );

        }

        document.getElementById("count")
            .textContent =
                words.length.toLocaleString() +
                " words available";

        buildAlphabet();

        setStatus("Ready");

        newWord();

    } catch (error) {

        console.error(error);

        setStatus(
            "Unable to load vocabulary"
        );

    }
}


// --------------------------------------------------
// NEW WORD
// --------------------------------------------------

function newWord(letter = currentLetter) {

    if (!words.length) {
        return;
    }

    currentLetter = letter;

    let available = words;

    if (currentLetter) {

        available =
            words.filter(item =>
                item.word &&
                item.word
                    .toLowerCase()
                    .startsWith(currentLetter)
            );

    }

    if (!available.length) {

        setStatus(
            "No words found"
        );

        return;
    }

    const index =
        Math.floor(
            Math.random() * available.length
        );

    currentWord =
        available[index];

    displayBasic(currentWord);

    getDictionaryData(
        currentWord.word
    );
}


// --------------------------------------------------
// DISPLAY WORD IMMEDIATELY
// --------------------------------------------------

function displayBasic(item) {

    const card =
        document.getElementById("card");

    card.classList.add("changing");

    setTimeout(() => {
        card.classList.remove("changing");
    }, 180);

    document.getElementById("word")
        .textContent =
            item.word || "—";

    document.getElementById("hindi")
        .textContent =
            item.hindi ||
            "Hindi meaning unavailable";

    document.getElementById("grammar")
        .textContent =
            item.grammar || "";

    document.getElementById("phonetic")
        .textContent = "";

    document.getElementById("definition")
        .innerHTML =
            '<div class="loading-line"></div>';

    document.getElementById("example")
        .textContent =
            "Finding an example...";

    audioURL = "";

    setStatus(
        "Loading English definition..."
    );
}


// --------------------------------------------------
// DICTIONARY API
// --------------------------------------------------

async function getDictionaryData(word) {

    const cacheKey =
        "vocab_definition_" +
        word.toLowerCase();


    // -----------------------------
    // CHECK CACHE
    // -----------------------------

    try {

        const cached =
            localStorage.getItem(cacheKey);

        if (cached) {

            const data =
                JSON.parse(cached);

            displayDictionary(data);

            setStatus(
                "⚡ Instant — cached definition"
            );

            return;
        }

    } catch (error) {

        console.log(
            "Cache unavailable"
        );

    }


    // -----------------------------
    // API REQUEST
    // -----------------------------

    try {

        const response =
            await fetch(
                DICTIONARY_API +
                encodeURIComponent(word)
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();


        // Don't update screen if
        // user already moved to another word

        if (
            !currentWord ||
            currentWord.word.toLowerCase() !==
            word.toLowerCase()
        ) {

            return;

        }


        // Save to cache

        try {

            localStorage.setItem(
                cacheKey,
                JSON.stringify(data)
            );

        } catch (error) {

            console.log(
                "Could not save cache"
            );

        }


        displayDictionary(data);

        setStatus(
            "Definition loaded"
        );

    } catch (error) {

        console.error(
            "Definition error:",
            error
        );

        document.getElementById("definition")
            .textContent =
                "English definition unavailable.";

        document.getElementById("example")
            .textContent =
                "Try another word.";

        setStatus(
            "Hindi meaning available • English definition unavailable"
        );
    }
}


// --------------------------------------------------
// DISPLAY API RESULT
// --------------------------------------------------

function displayDictionary(data) {

    if (
        !Array.isArray(data) ||
        !data.length
    ) {

        document.getElementById("definition")
            .textContent =
                "No definition found.";

        return;

    }

    const entry =
        data[0];


    // -----------------------------
    // PHONETIC
    // -----------------------------

    let phonetic = "";

    if (entry.phonetic) {

        phonetic =
            entry.phonetic;

    } else if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const found =
            entry.phonetics.find(
                item => item.text
            );

        if (found) {
            phonetic = found.text;
        }

    }

    document.getElementById("phonetic")
        .textContent =
            phonetic;


    // -----------------------------
    // AUDIO
    // -----------------------------

    audioURL = "";

    if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const audio =
            entry.phonetics.find(
                item => item.audio
            );

        if (audio) {
            audioURL = audio.audio;
        }

    }


    // -----------------------------
    // MEANING
    // -----------------------------

    let definition = "";

    let example = "";

    let partOfSpeech = "";


    if (
        entry.meanings &&
        entry.meanings.length
    ) {

        const meaning =
            entry.meanings[0];

        partOfSpeech =
            meaning.partOfSpeech || "";


        if (
            meaning.definitions &&
            meaning.definitions.length
        ) {

            const def =
                meaning.definitions[0];

            definition =
                def.definition || "";

            example =
                def.example || "";

        }

    }


    document.getElementById("definition")
        .textContent =
            definition ||
            "No English definition found.";


    document.getElementById("example")
        .textContent =
            example ||
            "No example sentence available.";


    if (
        !currentWord.grammar &&
        partOfSpeech
    ) {

        document.getElementById("grammar")
            .textContent =
                partOfSpeech;

    }
}


// --------------------------------------------------
// SEARCH
// --------------------------------------------------

function searchWord() {

    const input =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();

    if (!input) {
        return;
    }


    const found =
        words.find(item =>
            item.word &&
            item.word.toLowerCase() === input
        );


    if (!found) {

        setStatus(
            "Word not found in dictionary"
        );

        return;
    }


    currentWord = found;

    displayBasic(found);

    getDictionaryData(
        found.word
    );
}


function handleSearchKey(event) {

    if (event.key === "Enter") {
        searchWord();
    }
}


// --------------------------------------------------
// ALPHABET
// --------------------------------------------------

function buildAlphabet() {

    const container =
        document.getElementById(
            "alphabet"
        );

    container.innerHTML = "";


    // ALL

    const all =
        document.createElement(
            "button"
        );

    all.className =
        "letter";

    all.textContent =
        "ALL";

    all.onclick = () => {

        currentLetter = null;

        updateActiveLetter();

        newWord(null);

    };

    container.appendChild(all);


    // A-Z

    for (
        let i = 65;
        i <= 90;
        i++
    ) {

        const letter =
            String.fromCharCode(i);

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "letter";

        button.textContent =
            letter;

        button.dataset.letter =
            letter.toLowerCase();


        button.onclick = () => {

            currentLetter =
                letter.toLowerCase();

            updateActiveLetter();

            newWord(
                currentLetter
            );

        };


        container.appendChild(button);

    }
}


function updateActiveLetter() {

    document
        .querySelectorAll(".letter")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

            if (
                currentLetter &&
                button.dataset.letter ===
                currentLetter
            ) {

                button.classList.add(
                    "active"
                );

            }

        });

}


// --------------------------------------------------
// PRONOUNCE
// --------------------------------------------------

function pronounce() {

    if (!currentWord) {
        return;
    }


    if (audioURL) {

        const audio =
            new Audio(audioURL);

        audio.play()
            .catch(() => {
                speakWord();
            });

        return;
    }


    speakWord();
}


function speakWord() {

    if (
        !("speechSynthesis" in window)
    ) {

        setStatus(
            "Speech is not supported"
        );

        return;
    }


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            currentWord.word
        );

    speech.lang = "en-US";

    speech.rate = 0.8;


    speechSynthesis.speak(
        speech
    );
}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent =
        message;
}


// --------------------------------------------------
// 30 SECOND TIMER
// --------------------------------------------------

setInterval(() => {

    secondsRemaining--;

    if (
        secondsRemaining <= 0
    ) {

        secondsRemaining = 30;

        newWord(
            currentLetter
        );

    }

    document.getElementById(
        "timer"
    ).textContent =
        "Next word in " +
        secondsRemaining +
        " seconds";

}, 1000);


// --------------------------------------------------
// START
// --------------------------------------------------

loadWords();

</script>

</body>
</html>
