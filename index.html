<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word of the Day">

<title>Vocabulary</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont,
                     "SF Pro Display", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 600px;
        background: white;
        border-radius: 28px;
        padding: 30px;
        box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #777;
        margin-bottom: 10px;
    }

    #word {
        font-size: 42px;
        font-weight: 750;
        margin: 0 0 8px;
        word-break: break-word;
    }

    #phonetic {
        font-size: 18px;
        color: #777;
        margin-bottom: 22px;
    }

    .part {
        display: inline-block;
        background: #eee;
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 14px;
        margin-bottom: 18px;
    }

    .section {
        margin-top: 18px;
    }

    .section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        color: #888;
        margin-bottom: 7px;
    }

    .definition {
        font-size: 20px;
        line-height: 1.45;
    }

    .example {
        font-size: 17px;
        line-height: 1.45;
        color: #555;
        font-style: italic;
    }

    .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
    }

    .chip {
        background: #f0f0f2;
        padding: 7px 11px;
        border-radius: 10px;
        font-size: 14px;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 15px;
        padding: 14px;
        margin-top: 25px;
        font-size: 17px;
        font-weight: 600;
        background: #111;
        color: white;
    }

    button:active {
        transform: scale(.98);
    }

    #status {
        text-align: center;
        color: #777;
        margin-top: 15px;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="card">

    <div class="label">Vocabulary</div>

    <h1 id="word">Loading...</h1>

    <div id="phonetic"></div>

    <div id="part" class="part" style="display:none"></div>

    <div class="section">
        <div class="section-title">Meaning</div>
        <div id="definition" class="definition">
            Getting a word...
        </div>
    </div>

    <div class="section" id="exampleSection" style="display:none">
        <div class="section-title">Example</div>
        <div id="example" class="example"></div>
    </div>

    <div class="section" id="synonymSection" style="display:none">
        <div class="section-title">Synonyms</div>
        <div id="synonyms" class="chips"></div>
    </div>

    <button onclick="loadWord()">
        New Word
    </button>

    <div id="status">
        Loading...
    </div>

</div>

<script>

const RANDOM_WORD_API =
    "https://random-word-api.herokuapp.com/word?number=1&diff=4";

const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";

const ROTATION_TIME = 30000;

let currentWord = "";
let audioURL = "";


/* ----------------------------------
   RANDOM WORD
---------------------------------- */

async function getRandomWord() {

    const response = await fetch(
        RANDOM_WORD_API,
        {
            method: "GET",
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error(
            "Random word API HTTP " + response.status
        );
    }

    const data = await response.json();

    console.log("Random API:", data);

    if (!Array.isArray(data) || !data[0]) {
        throw new Error("Invalid random API response");
    }

    return data[0];
}


/* ----------------------------------
   DICTIONARY
---------------------------------- */

async function getDefinition(word) {

    const url =
        DICTIONARY_API +
        encodeURIComponent(word);

    const response = await fetch(
        url,
        {
            method: "GET",
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error(
            "Dictionary API HTTP " + response.status
        );
    }

    const data = await response.json();

    console.log("Dictionary API:", data);

    return data;
}


/* ----------------------------------
   DISPLAY
---------------------------------- */

function clearUI() {

    document.getElementById("word").textContent =
        "Loading...";

    document.getElementById("phonetic").textContent =
        "";

    document.getElementById("definition").textContent =
        "Finding meaning...";

    document.getElementById("example").textContent =
        "";

    document.getElementById("synonyms").innerHTML =
        "";

    document.getElementById("part").style.display =
        "none";

    document.getElementById("exampleSection").style.display =
        "none";

    document.getElementById("synonymSection").style.display =
        "none";

    audioURL = "";
}


function displayWord(word, dictionaryData) {

    document.getElementById("word").textContent =
        word;

    if (!dictionaryData ||
        !dictionaryData[0]) {

        document.getElementById("definition").textContent =
            "Definition unavailable.";

        return;
    }

    const entry = dictionaryData[0];

    /* phonetic */

    let phonetic =
        entry.phonetic || "";

    if (!phonetic && entry.phonetics) {

        const phoneticObject =
            entry.phonetics.find(
                p => p.text
            );

        if (phoneticObject) {
            phonetic =
                phoneticObject.text;
        }
    }

    document.getElementById("phonetic").textContent =
        phonetic;


    /* audio */

    if (entry.phonetics) {

        const audioObject =
            entry.phonetics.find(
                p => p.audio
            );

        if (audioObject) {
            audioURL =
                audioObject.audio.startsWith("//")
                    ? "https:" + audioObject.audio
                    : audioObject.audio;
        }
    }


    /* meaning */

    const meanings =
        entry.meanings || [];

    if (!meanings.length) {

        document.getElementById("definition").textContent =
            "Definition unavailable.";

        return;
    }

    const firstMeaning =
        meanings[0];

    const definition =
        firstMeaning.definitions?.[0];

    if (firstMeaning.partOfSpeech) {

        const part =
            document.getElementById("part");

        part.textContent =
            firstMeaning.partOfSpeech;

        part.style.display =
            "inline-block";
    }

    if (definition) {

        document.getElementById("definition").textContent =
            definition.definition;


        /* example */

        if (definition.example) {

            document.getElementById("example").textContent =
                definition.example;

            document.getElementById("exampleSection")
                .style.display = "block";
        }


        /* synonyms */

        if (definition.synonyms &&
            definition.synonyms.length) {

            const container =
                document.getElementById("synonyms");

            container.innerHTML = "";

            definition.synonyms
                .slice(0, 8)
                .forEach(word => {

                    const chip =
                        document.createElement("span");

                    chip.className =
                        "chip";

                    chip.textContent =
                        word;

                    container.appendChild(chip);
                });

            document.getElementById("synonymSection")
                .style.display = "block";
        }
    }
}


/* ----------------------------------
   MAIN
---------------------------------- */

async function loadWord() {

    clearUI();

    document.getElementById("status").textContent =
        "Getting a new word...";

    try {

        /* 1. Get random word */

        const word =
            await getRandomWord();

        currentWord =
            word;

        document.getElementById("word").textContent =
            word;


        document.getElementById("status").textContent =
            "Getting definition...";


        /* 2. Get dictionary data */

        const dictionaryData =
            await getDefinition(word);


        /* 3. Display */

        displayWord(
            word,
            dictionaryData
        );


        document.getElementById("status").textContent =
            "Changes automatically every 30 seconds";


    } catch (error) {

        console.error(
            "Vocabulary error:",
            error
        );

        document.getElementById("word").textContent =
            "Connection problem";

        document.getElementById("definition").textContent =
            "Unable to reach the vocabulary service.";

        document.getElementById("status").textContent =
            "Tap New Word to try again";
    }
}


/* ----------------------------------
   AUDIO
---------------------------------- */

function playAudio() {

    if (!audioURL) {

        alert(
            "Audio pronunciation unavailable."
        );

        return;
    }

    const audio =
        new Audio(audioURL);

    audio.play();
}


/* ----------------------------------
   AUTO ROTATION
---------------------------------- */

setInterval(
    loadWord,
    ROTATION_TIME
);


/* ----------------------------------
   START
---------------------------------- */

loadWord();

</script>

</body>
</html>
