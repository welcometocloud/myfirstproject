\<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#0f172a">

<title>Daily Vocabulary</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Segoe UI", sans-serif;

        background:
            radial-gradient(circle at top left, #334155, transparent 45%),
            radial-gradient(circle at bottom right, #1e3a8a, transparent 45%),
            #020617;

        color: white;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 650px;
    }

    .header {
        text-align: center;
        margin-bottom: 18px;
    }

    .header-title {
        font-size: 15px;
        letter-spacing: 3px;
        opacity: 0.65;
        font-weight: 600;
    }

    .card {
        position: relative;

        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.15);

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);

        border-radius: 30px;

        padding: 32px;

        box-shadow:
            0 25px 80px rgba(0,0,0,0.35);

        min-height: 570px;

        display: flex;
        flex-direction: column;
    }

    .category {
        display: inline-block;
        align-self: flex-start;

        padding: 7px 13px;

        border-radius: 20px;

        background: rgba(255,255,255,0.10);

        font-size: 12px;
        font-weight: 600;

        letter-spacing: 1px;

        opacity: 0.8;
    }

    .word {
        font-size: clamp(48px, 10vw, 76px);
        font-weight: 800;

        line-height: 1;

        margin-top: 35px;
        margin-bottom: 10px;

        letter-spacing: -2px;

        word-break: break-word;
    }

    .phonetic {
        font-size: 18px;
        opacity: 0.65;
        margin-bottom: 25px;
    }

    .part-of-speech {
        font-size: 15px;
        font-weight: 700;
        text-transform: uppercase;

        letter-spacing: 1px;

        opacity: 0.7;

        margin-bottom: 10px;
    }

    .definition {
        font-size: 23px;
        line-height: 1.45;

        margin-bottom: 25px;
    }

    .example {
        font-size: 17px;
        line-height: 1.5;

        opacity: 0.72;

        padding-left: 18px;

        border-left: 3px solid rgba(255,255,255,0.35);

        margin-bottom: 25px;
    }

    .label {
        font-size: 11px;
        text-transform: uppercase;

        letter-spacing: 2px;

        opacity: 0.45;

        margin-bottom: 7px;
    }

    .words {
        font-size: 15px;
        line-height: 1.6;

        opacity: 0.75;
    }

    .bottom {
        margin-top: auto;

        display: flex;
        justify-content: space-between;
        align-items: center;

        padding-top: 25px;
    }

    button {
        border: 0;

        color: white;

        background: rgba(255,255,255,0.12);

        border: 1px solid rgba(255,255,255,0.15);

        border-radius: 18px;

        padding: 12px 18px;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        transition: transform 0.15s ease,
                    background 0.15s ease;
    }

    button:active {
        transform: scale(0.94);
    }

    .audio {
        font-size: 22px;

        width: 48px;
        height: 48px;

        padding: 0;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .loading {
        opacity: 0.5;
        font-size: 18px;
    }

    .error {
        color: #fca5a5;
        line-height: 1.5;
    }

    .counter {
        font-size: 12px;
        opacity: 0.4;
    }

    @media (max-width: 600px) {

        body {
            padding: 12px;
        }

        .card {
            padding: 25px;
            min-height: 600px;
            border-radius: 25px;
        }

        .word {
            margin-top: 30px;
        }

        .definition {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="header-title">
            DAILY VOCABULARY
        </div>
    </div>

    <div class="card">

        <div id="category" class="category">
            LOADING
        </div>

        <div id="word" class="word">
            ...
        </div>

        <div id="phonetic" class="phonetic">
            Loading pronunciation...
        </div>

        <div id="partOfSpeech" class="part-of-speech">
        </div>

        <div id="definition" class="definition">
            <span class="loading">
                Fetching definition...
            </span>
        </div>

        <div id="example" class="example"></div>

        <div id="synonymsSection">

            <div class="label">
                Synonyms
            </div>

            <div id="synonyms" class="words">
            </div>

        </div>

        <div id="antonymsSection">

            <div class="label">
                Antonyms
            </div>

            <div id="antonyms" class="words">
            </div>

        </div>

        <div class="bottom">

            <div id="counter" class="counter">
                Vocabulary
            </div>

            <div>

                <button
                    id="audioButton"
                    class="audio"
                    onclick="playAudio()"
                    style="display:none;">
                    🔊
                </button>

                <button onclick="nextWord()">
                    Next →
                </button>

            </div>

        </div>

    </div>

</div>

<script>

/*
==========================================================

==========================================================
*/

/*

==========================================================

Only the words are stored.

You can expand this list to thousands of words.
*/

const vocabulary = [

    "accountability",

    "governance",

    "leadership",

    "automation",

    "affinity",

    "accelerate",

    "differentiate",
    "distribute",
    "evaluate",
    "execute",

    "formulate",
    "identify",
    "investigate",
    "optimize",

    "resolve",
    "standardize",
    "transform",
    "troubleshoot",

    // Advanced vocabulary

    "ameliorate",
    "anachronistic",

    "delineate",
    "disparate",
    "eloquent",
    "ephemeral",
    "exacerbate",
    "exemplify",
    "fastidious",

    "impetuous",
    "indispensable",
    "meticulous",
    "nuanced",
    "pervasive",
    "pragmatic",
    "proliferate",
    "scrutinize",
    "sporadic",
    "ubiquitous",
    "unprecedented",
    "versatile",

    // Interview vocabulary

    "architecture",

    "diagnosis",
    "disruption",
    "incident",
    "optimization",
    "resilience",

    "tradeoff",
    "zero-downtime"
];


/*
==========================================================
STATE
==========================================================
*/

let currentIndex =
    parseInt(localStorage.getItem("vocabIndex") || "0");

let currentAudio = null;


/*
==========================================================
ELEMENTS
==========================================================
*/

const wordElement =
    document.getElementById("word");

const phoneticElement =
    document.getElementById("phonetic");

const definitionElement =
    document.getElementById("definition");

const exampleElement =
    document.getElementById("example");

const partOfSpeechElement =
    document.getElementById("partOfSpeech");

const synonymsElement =
    document.getElementById("synonyms");

const antonymsElement =
    document.getElementById("antonyms");

const synonymsSection =
    document.getElementById("synonymsSection");

const antonymsSection =
    document.getElementById("antonymsSection");

const categoryElement =
    document.getElementById("category");

const counterElement =
    document.getElementById("counter");

const audioButton =
    document.getElementById("audioButton");


/*
==========================================================
CATEGORY
==========================================================
*/

function getCategory(word) {

    const devops = [
        "automation",
        "availability",
        "deployment",
        "elasticity",
        "endpoint",
        "failover",
        "immutable",
        "infrastructure",
        "latency",
        "observability",
        "orchestration",
        "provision",
        "redundancy",
        "scalability",
        "telemetry",
        "throughput"
    ];

    const advanced = [
        "ameliorate",
        "anachronistic",
        "conundrum",
        "delineate",
        "disparate",
        "eloquent",
        "ephemeral",
        "exacerbate",
        "fastidious",
        "gregarious",
        "impetuous",
        "indispensable",
        "meticulous",
        "nuanced",
        "pervasive",
        "pragmatic",
        "proliferate",
        "scrutinize",
        "ubiquitous",
        "unprecedented"
    ];

    if (devops.includes(word))
        return "DEVOPS";

    if (advanced.includes(word))
        return "ADVANCED";

    return "PROFESSIONAL";
}


/*
==========================================================
FETCH DICTIONARY
==========================================================
*/

async function fetchDefinition(word) {

    const cacheKey = "dictionary_" + word;

    /*
    Check local cache first
    */

    const cached =
        localStorage.getItem(cacheKey);

    if (cached) {

        try {

            return JSON.parse(cached);

        } catch (error) {

            console.log("Invalid cache");

        }

    }


    /*
    Fetch from Free Dictionary API
    */

    const url =
        `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error("Word not found");

    }

    const data =
        await response.json();

    /*
    Save result locally
    */

    localStorage.setItem(
        cacheKey,
        JSON.stringify(data)
    );

    return data;
}


/*
==========================================================
DISPLAY WORD
==========================================================
*/

async function showWord() {

    if (currentIndex >= vocabulary.length)
        currentIndex = 0;

    const word =
        vocabulary[currentIndex];

    localStorage.setItem(
        "vocabIndex",
        currentIndex
    );

    /*
    Reset UI
    */

    wordElement.textContent =
        word;

    categoryElement.textContent =
        getCategory(word);

    phoneticElement.textContent =
        "Loading pronunciation...";

    partOfSpeechElement.textContent =
        "";

    definitionElement.innerHTML =
        `<span class="loading">
            Fetching definition...
        </span>`;

    exampleElement.textContent =
        "";

    synonymsElement.textContent =
        "";

    antonymsElement.textContent =
        "";

    synonymsSection.style.display =
        "none";

    antonymsSection.style.display =
        "none";

    audioButton.style.display =
        "none";

    counterElement.textContent =
        `${currentIndex + 1} / ${vocabulary.length}`;


    try {

        const data =
            await fetchDefinition(word);

        /*
        First dictionary entry
        */

        const entry =
            data[0];

        /*
        Pronunciation
        */

        let phonetic =
            entry.phonetic || "";

        if (!phonetic && entry.phonetics) {

            const item =
                entry.phonetics.find(
                    p => p.text
                );

            if (item)
                phonetic = item.text;
        }

        phoneticElement.textContent =
            phonetic || "Pronunciation unavailable";


        /*
        Audio
        */

        currentAudio = null;

        if (entry.phonetics) {

            const audioEntry =
                entry.phonetics.find(
                    p => p.audio
                );

            if (audioEntry) {

                currentAudio =
                    audioEntry.audio;

                audioButton.style.display =
                    "flex";
            }
        }


        /*
        Meaning
        */

        const meaning =
            entry.meanings?.[0];

        if (meaning) {

            partOfSpeechElement.textContent =
                meaning.partOfSpeech || "";

            const definition =
                meaning.definitions?.[0];

            if (definition) {

                definitionElement.textContent =
                    definition.definition || "";

                if (definition.example) {

                    exampleElement.textContent =
                        `"${definition.example}"`;

                }

            }

        }


        /*
        Synonyms
        */

        let synonyms = [];

        if (meaning?.synonyms) {

            synonyms =
                meaning.synonyms;

        }

        if (synonyms.length > 0) {

            synonymsElement.textContent =
                synonyms.slice(0, 8).join(" • ");

            synonymsSection.style.display =
                "block";
        }


        /*
        Antonyms
        */

        let antonyms = [];

        if (meaning?.antonyms) {

            antonyms =
                meaning.antonyms;

        }

        if (antonyms.length > 0) {

            antonymsElement.textContent =
                antonyms.slice(0, 8).join(" • ");

            antonymsSection.style.display =
                "block";
        }


    } catch (error) {

        console.log(error);

        definitionElement.innerHTML = `
            <div class="error">
                Definition unavailable for this word.
                <br><br>
                Moving to another word...
            </div>
        `;

        /*
        Automatically skip unavailable words
        */

        setTimeout(() => {

            nextWord();

        }, 1500);
    }
}


/*
==========================================================
NEXT WORD
==========================================================
*/

function nextWord() {

    currentIndex++;

    if (currentIndex >= vocabulary.length)
        currentIndex = 0;

    showWord();
}


/*
==========================================================
AUDIO
==========================================================
*/

function playAudio() {

    if (!currentAudio)
        return;

    const audio =
        new Audio(currentAudio);

    audio.play();

}


/*
==========================================================
AUTOMATIC ROTATION
==========================================================
*/

setInterval(() => {

    nextWord();

}, ROTATION_TIME);


/*
==========================================================
START
==========================================================
*/

showWord();

</script>

</body>
</html>
