<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">

<title>English Hindi Vocabulary</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 720px;
}

h1 {
    text-align: center;
    margin: 10px 0 5px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.word {
    text-align: center;
    font-size: 42px;
    font-weight: 700;
    margin-top: 10px;
    word-break: break-word;
}

.phonetic {
    text-align: center;
    color: #6b7280;
    font-size: 18px;
    margin-top: 8px;
}

.grammar {
    text-align: center;
    color: #7c3aed;
    font-weight: 600;
    margin-top: 8px;
}

.section {
    margin-top: 24px;
}

.label {
    font-size: 13px;
    font-weight: 700;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 7px;
}

.meaning {
    font-size: 19px;
    line-height: 1.6;
}

.hindi {
    font-size: 22px;
    line-height: 1.6;
}

.example {
    font-style: italic;
    color: #4b5563;
    line-height: 1.6;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: #111827;
    color: white;
}

button.secondary {
    background: #e5e7eb;
    color: #111827;
}

button:active {
    transform: scale(0.98);
}

.search {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.search input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
}

.alphabet {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 18px;
}

.letter {
    flex: none;
    width: 35px;
    height: 35px;
    padding: 0;
    border-radius: 10px;
    background: #e5e7eb;
    color: #111827;
    font-size: 14px;
}

.letter.active {
    background: #111827;
    color: white;
}

.status {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #6b7280;
}

.count {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: #9ca3af;
}

.loading {
    opacity: 0.55;
}

@media (max-width: 500px) {
    .card {
        padding: 22px;
    }

    .word {
        font-size: 34px;
    }

    .meaning {
        font-size: 17px;
    }

    .hindi {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>📚 Vocabulary</h1>

    <div class="subtitle">
        English → Hindi
    </div>

    <div class="card" id="card">

        <div class="word" id="word">
            Loading...
        </div>

        <div class="phonetic" id="phonetic"></div>

        <div class="grammar" id="grammar"></div>

        <div class="section">
            <div class="label">English Definition</div>
            <div class="meaning" id="definition">
                Loading definition...
            </div>
        </div>

        <div class="section">
            <div class="label">Hindi Meaning</div>
            <div class="hindi" id="hindi">
                Loading...
            </div>
        </div>

        <div class="section">
            <div class="label">Example</div>
            <div class="example" id="example">
                —
            </div>
        </div>

        <div class="buttons">
            <button onclick="newWord()">
                New Word
            </button>

            <button class="secondary" onclick="pronounce()">
                🔊 Pronounce
            </button>
        </div>

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="Search a word..."
                onkeydown="handleSearchKey(event)"
            >

            <button onclick="searchWord()">
                Search
            </button>
        </div>

        <div class="alphabet" id="alphabet"></div>

        <div class="status" id="status">
            Loading dictionary...
        </div>

        <div class="count" id="count"></div>

    </div>

</div>

<script>

const WORDS_FILE = "./words.json";

const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";

let words = [];
let currentWord = null;
let currentLetter = null;
let audioURL = "";


// --------------------------------------------------
// LOAD WORDS.JSON
// --------------------------------------------------

async function loadWords() {

    setStatus("Loading vocabulary...");

    try {

        const response = await fetch(
            WORDS_FILE + "?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "words.json HTTP " + response.status
            );
        }

        words = await response.json();

        if (!Array.isArray(words)) {
            throw new Error("words.json is not an array");
        }

        document.getElementById("count").textContent =
            words.length.toLocaleString() +
            " English words available";

        buildAlphabet();

        setStatus("Dictionary loaded");

        newWord();

    } catch (error) {

        console.error("words.json error:", error);

        setStatus(
            "Could not load words.json: " + error.message
        );

        document.getElementById("word").textContent =
            "Error";

    }
}


// --------------------------------------------------
// RANDOM WORD
// --------------------------------------------------

function newWord(letter = currentLetter) {

    if (!words.length) {
        return;
    }

    currentLetter = letter;

    let available = words;

    if (currentLetter) {

        available = words.filter(item =>
            item.word &&
            item.word.toLowerCase().startsWith(currentLetter)
        );

    }

    if (!available.length) {

        setStatus(
            "No words found for " +
            currentLetter.toUpperCase()
        );

        return;
    }

    const randomIndex =
        Math.floor(Math.random() * available.length);

    currentWord = available[randomIndex];

    displayBasic(currentWord);

    getDictionaryData(currentWord.word);
}


// --------------------------------------------------
// DISPLAY LOCAL JSON DATA
// --------------------------------------------------

function displayBasic(item) {

    document.getElementById("word").textContent =
        item.word || "—";

    document.getElementById("hindi").textContent =
        item.hindi || "Hindi meaning unavailable";

    document.getElementById("grammar").textContent =
        item.grammar || "";

    document.getElementById("phonetic").textContent = "";

    document.getElementById("definition").textContent =
        "Loading English definition...";

    document.getElementById("example").textContent =
        "Loading example...";

    audioURL = "";

    document.getElementById("card")
        .classList.add("loading");
}


// --------------------------------------------------
// FREE DICTIONARY API
// --------------------------------------------------

async function getDictionaryData(word) {

    setStatus("Fetching English definition...");

    const cacheKey =
        "dictionary_" + word.toLowerCase();

    // First check browser cache
    try {

        const cached =
            localStorage.getItem(cacheKey);

        if (cached) {

            console.log(
                "Using cached definition for:",
                word
            );

            const data = JSON.parse(cached);

            displayDictionary(data);

            setStatus("Definition loaded from cache");

            document.getElementById("card")
                .classList.remove("loading");

            return;
        }

    } catch (error) {

        console.log("Cache read failed:", error);

    }


    try {

        const url =
            DICTIONARY_API +
            encodeURIComponent(word);

        console.log("Fetching:", url);

        const response =
            await fetch(url);

        console.log(
            "Dictionary API status:",
            response.status
        );

        if (!response.ok) {

            throw new Error(
                "API returned HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        console.log(
            "Dictionary API response:",
            data
        );

        // Save successful response
        try {

            localStorage.setItem(
                cacheKey,
                JSON.stringify(data)
            );

        } catch (error) {

            console.log(
                "Could not cache result:",
                error
            );

        }

        // Make sure this is still the displayed word
        if (
            currentWord &&
            currentWord.word.toLowerCase() ===
            word.toLowerCase()
        ) {

            displayDictionary(data);

            setStatus("Definition loaded");

        }

    } catch (error) {

        console.error(
            "Dictionary API error:",
            error
        );

        document.getElementById("definition").textContent =
            "English definition unavailable for this word.";

        document.getElementById("example").textContent =
            "Try another word.";

        setStatus(
            "Hindi meaning available • English definition unavailable"
        );

    } finally {

        document.getElementById("card")
            .classList.remove("loading");

    }
}


// --------------------------------------------------
// PARSE API RESPONSE
// --------------------------------------------------

function displayDictionary(data) {

    if (!Array.isArray(data) || !data.length) {

        document.getElementById("definition").textContent =
            "No English definition found.";

        return;
    }

    const entry = data[0];

    // -----------------------------
    // PHONETIC
    // -----------------------------

    let phonetic = "";

    if (entry.phonetic) {

        phonetic = entry.phonetic;

    } else if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const phoneticEntry =
            entry.phonetics.find(p => p.text);

        if (phoneticEntry) {
            phonetic = phoneticEntry.text;
        }

    }

    document.getElementById("phonetic").textContent =
        phonetic;


    // -----------------------------
    // AUDIO
    // -----------------------------

    audioURL = "";

    if (
        entry.phonetics &&
        entry.phonetics.length
    ) {

        const audioEntry =
            entry.phonetics.find(p => p.audio);

        if (audioEntry) {
            audioURL = audioEntry.audio;
        }

    }


    // -----------------------------
    // MEANING
    // -----------------------------

    let definition = "";
    let example = "";
    let partOfSpeech = "";

    if (
        entry.meanings &&
        entry.meanings.length
    ) {

        const meaning =
            entry.meanings[0];

        partOfSpeech =
            meaning.partOfSpeech || "";

        if (
            meaning.definitions &&
            meaning.definitions.length
        ) {

            const firstDefinition =
                meaning.definitions[0];

            definition =
                firstDefinition.definition || "";

            example =
                firstDefinition.example || "";

        }

    }


    document.getElementById("definition").textContent =
        definition ||
        "No English definition found.";

    document.getElementById("example").textContent =
        example ||
        "No example sentence available.";

    // Only replace grammar if JSON didn't provide it
    if (
        !currentWord.grammar &&
        partOfSpeech
    ) {

        document.getElementById("grammar").textContent =
            partOfSpeech;

    }
}


// --------------------------------------------------
// SEARCH
// --------------------------------------------------

function searchWord() {

    const input =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if (!input) {
        return;
    }

    const found =
        words.find(item =>
            item.word &&
            item.word.toLowerCase() === input
        );

    if (!found) {

        setStatus(
            "Word not found in local dictionary"
        );

        return;
    }

    currentWord = found;

    displayBasic(found);

    getDictionaryData(found.word);
}


function handleSearchKey(event) {

    if (event.key === "Enter") {
        searchWord();
    }
}


// --------------------------------------------------
// ALPHABET
// --------------------------------------------------

function buildAlphabet() {

    const alphabet =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const container =
        document.getElementById("alphabet");

    container.innerHTML = "";

    // ALL button
    const allButton =
        document.createElement("button");

    allButton.className = "letter";

    allButton.textContent = "ALL";

    allButton.onclick = () => {

        currentLetter = null;

        updateActiveLetter();

        newWord(null);

    };

    container.appendChild(allButton);


    for (const letter of alphabet) {

        const button =
            document.createElement("button");

        button.className = "letter";

        button.textContent = letter;

        button.dataset.letter =
            letter.toLowerCase();

        button.onclick = () => {

            currentLetter =
                letter.toLowerCase();

            updateActiveLetter();

            newWord(currentLetter);

        };

        container.appendChild(button);
    }
}


function updateActiveLetter() {

    document
        .querySelectorAll(".letter")
        .forEach(button => {

            button.classList.remove("active");

            if (
                currentLetter &&
                button.dataset.letter === currentLetter
            ) {

                button.classList.add("active");

            }

        });
}


// --------------------------------------------------
// PRONUNCIATION
// --------------------------------------------------

function pronounce() {

    if (!currentWord) {
        return;
    }

    // Prefer real dictionary audio
    if (audioURL) {

        const audio =
            new Audio(audioURL);

        audio.play().catch(error => {

            console.log(
                "Audio playback failed:",
                error
            );

            speakWord();

        });

        return;
    }

    // Browser speech fallback
    speakWord();
}


function speakWord() {

    if (!("speechSynthesis" in window)) {

        setStatus(
            "Speech synthesis not supported"
        );

        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            currentWord.word
        );

    speech.lang = "en-US";
    speech.rate = 0.8;

    window.speechSynthesis.speak(speech);
}


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;
}


// --------------------------------------------------
// AUTOMATIC WORD CHANGE
// --------------------------------------------------

setInterval(() => {

    if (words.length) {
        newWord(currentLetter);
    }

}, 30000);


// --------------------------------------------------
// START
// --------------------------------------------------

loadWords();

</script>

</body>
</html>
