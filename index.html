<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f7fb">
<title>English → Hindi Vocabulary</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "SF Pro Text", Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

.container {
    max-width: 850px;
    margin: 0 auto;
    padding: 24px 18px 40px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.header p {
    margin: 7px 0 0;
    color: #6b7280;
    font-size: 15px;
}

.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.search-box input {
    flex: 1;
    border: 1px solid #d9deea;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search-box input:focus {
    border-color: #7c8cff;
}

.search-box button {
    border: none;
    border-radius: 14px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 700;
    background: #5967f2;
    color: white;
}

.alphabet {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
}

.alphabet button {
    min-width: 30px;
    height: 30px;
    border: 1px solid #dfe3ec;
    border-radius: 8px;
    background: white;
    font-weight: 600;
    color: #4b5563;
}

.alphabet button.active {
    background: #5967f2;
    color: white;
    border-color: #5967f2;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 26px;
    box-shadow: 0 10px 30px rgba(30, 40, 70, 0.08);
}

.word-header {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid #edf0f5;
}

.word {
    font-size: 38px;
    font-weight: 850;
    margin: 0;
    word-break: break-word;
}

.phonetic {
    margin-top: 7px;
    color: #687386;
    font-size: 16px;
}

.section {
    margin-top: 22px;
}

.section-title {
    font-size: 13px;
    font-weight: 800;
    color: #7b8494;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
}

.definition {
    font-size: 18px;
    line-height: 1.55;
}

.definition-list {
    margin: 0;
    padding-left: 22px;
}

.definition-list li {
    margin-bottom: 9px;
}

.hindi {
    font-size: 24px;
    line-height: 1.5;
}

.example {
    font-size: 17px;
    line-height: 1.55;
    color: #4b5563;
    font-style: italic;
}

.grammar {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 999px;
    background: #eef0ff;
    color: #4c58d9;
    font-size: 13px;
    font-weight: 800;
}

.pos {
    display: inline-block;
    margin-left: 7px;
    padding: 5px 9px;
    border-radius: 999px;
    background: #f1f3f6;
    color: #606978;
    font-size: 12px;
    font-weight: 700;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 750;
}

.pronounce {
    background: #eef0ff;
    color: #4c58d9;
}

.new-word {
    background: #5967f2;
    color: white;
}

.status {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
    color: #7b8494;
    min-height: 18px;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #8a92a1;
    font-size: 13px;
}

.timer {
    margin-top: 5px;
}

.loading {
    color: #9aa2b1;
}

.error {
    color: #b45309;
}

@media (max-width: 600px) {
    .container {
        padding: 18px 13px 30px;
    }

    .card {
        padding: 21px 18px;
        border-radius: 20px;
    }

    .word {
        font-size: 32px;
    }

    .hindi {
        font-size: 22px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>English → Hindi</h1>
        <p>Build your vocabulary one word at a time</p>
    </div>

    <div class="search-box">
        <input
            id="searchInput"
            type="search"
            placeholder="Search an English word..."
            autocomplete="off"
            autocapitalize="none">
        <button onclick="searchWord()">Search</button>
    </div>

    <div class="alphabet" id="alphabet"></div>

    <div class="card">

        <div class="word-header">
            <h2 class="word" id="word">Loading...</h2>
            <div class="phonetic" id="phonetic"></div>
        </div>

        <div class="section">
            <div class="section-title">English Definition</div>
            <div class="definition" id="definition">
                <span class="loading">Loading definition...</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Hindi Meaning</div>
            <div class="hindi" id="hindi">
                —
            </div>
        </div>

        <div class="section">
            <div class="section-title">Example</div>
            <div class="example" id="example">
                <span class="loading">Loading example...</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Grammar</div>
            <div id="grammar"></div>
        </div>

        <div class="actions">
            <button class="pronounce" onclick="pronounce()">
                🔊 Pronounce
            </button>

            <button class="new-word" onclick="newWord()">
                ✨ New Word
            </button>
        </div>

        <div class="status" id="apiStatus"></div>

    </div>

    <div class="footer">
        <div id="count"></div>
        <div class="timer" id="timer"></div>
    </div>

</div>

<script>

const WORDS_FILE = "./words.json";

const DICTIONARY_API =
    "https://api.dictionaryapi.dev/api/v2/entries/en/";

const WIKTIONARY_API =
    "https://en.wiktionary.org/api/rest_v1/page/definition/";

const CACHE_PREFIX = "vocab_combined_";

let words = [];
let filteredWords = [];
let currentIndex = 0;
let currentWord = "";
let currentAudio = null;

let secondsRemaining = 30;


/* ---------------------------------------------------------
   INITIAL LOAD
--------------------------------------------------------- */

document.addEventListener("DOMContentLoaded", async () => {

    buildAlphabet();

    document
        .getElementById("searchInput")
        .addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                searchWord();
            }
        });

    await loadWords();

    if (words.length > 0) {
        filteredWords = words;
        showWord(0);
    }

    startTimer();
});


/* ---------------------------------------------------------
   LOAD LOCAL WORDS
--------------------------------------------------------- */

async function loadWords() {

    try {

        const response = await fetch(
            WORDS_FILE + "?v=" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "Could not load words.json"
            );
        }

        words = await response.json();

        if (!Array.isArray(words)) {
            throw new Error(
                "words.json must contain an array"
            );
        }

        words = words
            .filter(item =>
                item &&
                item.word &&
                item.hindi
            )
            .map(item => ({
                word: String(item.word).trim(),
                hindi: String(item.hindi).trim(),
                grammar: item.grammar
                    ? String(item.grammar).trim()
                    : ""
            }));

        filteredWords = words;

        updateCount();

    } catch (error) {

        console.error(error);

        document.getElementById("word").textContent =
            "Unable to load words";

        document.getElementById("definition").innerHTML =
            '<span class="error">words.json could not be loaded.</span>';

    }
}


/* ---------------------------------------------------------
   DISPLAY LOCAL WORD DATA
--------------------------------------------------------- */

function displayBasic(item) {

    currentWord = item.word;

    document.getElementById("word").textContent =
        item.word;

    document.getElementById("hindi").textContent =
        item.hindi || "—";

    document.getElementById("grammar").innerHTML =
        item.grammar
            ? `<span class="grammar">${escapeHTML(item.grammar)}</span>`
            : `<span class="grammar">—</span>`;

    document.getElementById("phonetic").textContent =
        "";

    document.getElementById("definition").innerHTML =
        '<span class="loading">Loading English definition...</span>';

    document.getElementById("example").innerHTML =
        '<span class="loading">Loading example...</span>';

    document.getElementById("apiStatus").textContent =
        "Loading dictionary APIs...";

    currentAudio = null;
}


/* ---------------------------------------------------------
   SHOW WORD
--------------------------------------------------------- */

async function showWord(index) {

    if (!filteredWords.length) {
        return;
    }

    if (index < 0) {
        index = filteredWords.length - 1;
    }

    if (index >= filteredWords.length) {
        index = 0;
    }

    currentIndex = index;

    const item = filteredWords[currentIndex];

    displayBasic(item);

    updateCount();

    await loadDictionaryInformation(item.word);
}


/* ---------------------------------------------------------
   COMBINED API LOADER
--------------------------------------------------------- */

async function loadDictionaryInformation(word) {

    const normalizedWord =
        word.trim().toLowerCase();

    const cacheKey =
        CACHE_PREFIX + normalizedWord;

    /*
     * Check local cache first.
     */

    try {

        const cached =
            localStorage.getItem(cacheKey);

        if (cached) {

            const data = JSON.parse(cached);

            if (data) {

                displayCombinedData(data);

                return;
            }
        }

    } catch (error) {

        console.warn(
            "Cache read error:",
            error
        );
    }


    /*
     * Call both APIs at the same time.
     */

    const dictionaryPromise =
        fetchDictionaryAPI(normalizedWord);

    const wiktionaryPromise =
        fetchWiktionaryAPI(normalizedWord);


    const results =
        await Promise.allSettled([
            dictionaryPromise,
            wiktionaryPromise
        ]);


    /*
     * Prevent an old API request from
     * overwriting the newly selected word.
     */

    if (
        currentWord.toLowerCase() !== normalizedWord
    ) {
        return;
    }


    const dictionaryData =
        results[0].status === "fulfilled"
            ? results[0].value
            : null;

    const wiktionaryData =
        results[1].status === "fulfilled"
            ? results[1].value
            : null;


    const combined = {
        dictionary: dictionaryData,
        wiktionary: wiktionaryData
    };


    try {

        localStorage.setItem(
            cacheKey,
            JSON.stringify(combined)
        );

    } catch (error) {

        console.warn(
            "Cache write error:",
            error
        );
    }


    displayCombinedData(combined);
}


/* ---------------------------------------------------------
   DICTIONARYAPI.DEV
--------------------------------------------------------- */

async function fetchDictionaryAPI(word) {

    const url =
        DICTIONARY_API +
        encodeURIComponent(word);

    const response =
        await fetch(url);

    if (!response.ok) {
        throw new Error(
            `dictionaryapi.dev returned ${response.status}`
        );
    }

    const data =
        await response.json();

    if (!Array.isArray(data)) {
        throw new Error(
            "Unexpected dictionaryapi.dev response"
        );
    }

    return data;
}


/* ---------------------------------------------------------
   WIKTIONARY
--------------------------------------------------------- */

async function fetchWiktionaryAPI(word) {

    const url =
        WIKTIONARY_API +
        encodeURIComponent(word);

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `Wiktionary returned ${response.status}`
        );
    }

    const data =
        await response.json();

    return data;
}


/* ---------------------------------------------------------
   DISPLAY COMBINED API DATA
--------------------------------------------------------- */

function displayCombinedData(data) {

    const dictionaryData =
        data ? data.dictionary : null;

    const wiktionaryData =
        data ? data.wiktionary : null;


    let definitions = [];

    let example = "";

    let phonetic = "";

    let audio = "";

    let dictionaryFound = false;


    /*
     * dictionaryapi.dev
     */

    if (Array.isArray(dictionaryData)) {

        dictionaryFound = true;

        for (const entry of dictionaryData) {

            /*
             * Phonetic
             */

            if (!phonetic && entry.phonetic) {

                phonetic =
                    entry.phonetic;
            }


            /*
             * Phonetics array
             */

            if (Array.isArray(entry.phonetics)) {

                for (const phoneticItem of entry.phonetics) {

                    if (
                        !phonetic &&
                        phoneticItem.text
                    ) {
                        phonetic =
                            phoneticItem.text;
                    }

                    if (
                        !audio &&
                        phoneticItem.audio
                    ) {
                        audio =
                            phoneticItem.audio;
                    }
                }
            }


            /*
             * Meanings / definitions
             */

            if (Array.isArray(entry.meanings)) {

                for (const meaning of entry.meanings) {

                    if (Array.isArray(meaning.definitions)) {

                        for (
                            const definitionItem
                            of meaning.definitions
                        ) {

                            if (
                                definitionItem.definition
                            ) {

                                definitions.push({
                                    text:
                                        definitionItem.definition,
                                    source:
                                        "dictionary"
                                });
                            }

                            if (
                                !example &&
                                definitionItem.example
                            ) {

                                example =
                                    definitionItem.example;
                            }
                        }
                    }
                }
            }
        }
    }


    /*
     * Wiktionary definitions
     */

    const wiktionaryDefinitions =
        extractWiktionaryDefinitions(
            wiktionaryData
        );


    for (
        const item
        of wiktionaryDefinitions
    ) {

        definitions.push({
            text: item.definition,
            source: "wiktionary",
            partOfSpeech: item.partOfSpeech
        });
    }


    /*
     * Remove duplicate definitions.
     */

    const seen =
        new Set();

    definitions =
        definitions.filter(item => {

            const key =
                item.text
                    .toLowerCase()
                    .trim();

            if (seen.has(key)) {
                return false;
            }

            seen.add(key);

            return true;
        });


    /*
     * Keep first 6 useful definitions.
     */

    definitions =
        definitions.slice(0, 6);


    /*
     * Definition display
     */

    if (definitions.length > 0) {

        const html =
            definitions
                .map(item =>
                    `<li>${escapeHTML(item.text)}</li>`
                )
                .join("");

        document.getElementById(
            "definition"
        ).innerHTML =
            `<ol class="definition-list">${html}</ol>`;

    } else {

        document.getElementById(
            "definition"
        ).innerHTML =
            `<span class="error">
                English definition is not available for this word.
            </span>`;
    }


    /*
     * Example
     */

    if (example) {

        document.getElementById(
            "example"
        ).textContent =
            example;

    } else {

        document.getElementById(
            "example"
        ).textContent =
            "No example sentence available.";
    }


    /*
     * Phonetic
     */

    document.getElementById(
        "phonetic"
    ).textContent =
        phonetic || "";


    /*
     * Save audio URL
     */

    currentAudio =
        audio || null;


    /*
     * API status
     */

    if (
        dictionaryFound &&
        wiktionaryDefinitions.length > 0
    ) {

        document.getElementById(
            "apiStatus"
        ).textContent =
            "✓ Dictionary + Wiktionary";

    } else if (dictionaryFound) {

        document.getElementById(
            "apiStatus"
        ).textContent =
            "✓ Dictionary API";

    } else if (wiktionaryDefinitions.length > 0) {

        document.getElementById(
            "apiStatus"
        ).textContent =
            "✓ Wiktionary";

    } else {

        document.getElementById(
            "apiStatus"
        ).textContent =
            "English API data unavailable";
    }
}


/* ---------------------------------------------------------
   WIKTIONARY RESPONSE PARSER
--------------------------------------------------------- */

function extractWiktionaryDefinitions(data) {

    const output = [];

    if (!data || typeof data !== "object") {
        return output;
    }


    /*
     * Expected structure:
     *
     * {
     *   "en": [
     *      {
     *        "partOfSpeech": "...",
     *        "definitions": [...]
     *      }
     *   ]
     * }
     */

    const sections =
        data.en || [];


    if (!Array.isArray(sections)) {
        return output;
    }


    for (const section of sections) {

        const partOfSpeech =
            section.partOfSpeech || "";


        if (
            !Array.isArray(section.definitions)
        ) {
            continue;
        }


        for (
            const item
            of section.definitions
        ) {

            if (!item.definition) {
                continue;
            }


            const cleanDefinition =
                stripHtml(item.definition);


            if (cleanDefinition.trim()) {

                output.push({
                    partOfSpeech:
                        partOfSpeech,
                    definition:
                        cleanDefinition
                });
            }
        }
    }


    return output;
}


/* ---------------------------------------------------------
   STRIP HTML
--------------------------------------------------------- */

function stripHtml(htmlString) {

    if (
        typeof window !== "undefined" &&
        window.document
    ) {

        const tempDiv =
            document.createElement("div");

        tempDiv.innerHTML =
            htmlString;

        return (
            tempDiv.textContent ||
            tempDiv.innerText ||
            ""
        );
    }


    return String(htmlString)
        .replace(/<[^>]*>/g, "");
}


/* ---------------------------------------------------------
   PRONUNCIATION
--------------------------------------------------------- */

function pronounce() {

    /*
     * First use dictionaryapi.dev audio.
     */

    if (currentAudio) {

        try {

            const audio =
                new Audio(currentAudio);

            audio.play();

            return;

        } catch (error) {

            console.warn(
                "Audio playback failed:",
                error
            );
        }
    }


    /*
     * Browser speech fallback.
     */

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                currentWord
            );

        utterance.lang = "en-US";

        utterance.rate = 0.85;

        window.speechSynthesis.speak(
            utterance
        );

        return;
    }


    alert(
        "Pronunciation is not available."
    );
}


/* ---------------------------------------------------------
   NEW WORD
--------------------------------------------------------- */

function newWord() {

    if (!filteredWords.length) {
        return;
    }

    let nextIndex;

    if (filteredWords.length === 1) {

        nextIndex = 0;

    } else {

        do {

            nextIndex =
                Math.floor(
                    Math.random() *
                    filteredWords.length
                );

        } while (
            nextIndex === currentIndex
        );
    }

    showWord(nextIndex);

    resetTimer();
}


/* ---------------------------------------------------------
   SEARCH
--------------------------------------------------------- */

function searchWord() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value
            .trim()
            .toLowerCase();


    if (!query) {
        return;
    }


    const exactIndex =
        words.findIndex(item =>
            item.word.toLowerCase() === query
        );


    if (exactIndex !== -1) {

        filteredWords = words;

        showWord(exactIndex);

        resetTimer();

        return;
    }


    /*
     * Partial search.
     */

    const matches =
        words.filter(item =>
            item.word
                .toLowerCase()
                .includes(query)
        );


    if (matches.length > 0) {

        filteredWords = matches;

        showWord(0);

        resetTimer();

        return;
    }


    /*
     * Word isn't in local words.json.
     *
     * We don't invent Hindi meaning.
     */

    document.getElementById(
        "word"
    ).textContent =
        query;


    document.getElementById(
        "hindi"
    ).textContent =
        "Not available in words.json";


    document.getElementById(
        "grammar"
    ).innerHTML =
        `<span class="grammar">—</span>`;


    document.getElementById(
        "definition"
    ).innerHTML =
        `<span class="loading">
            Checking English APIs...
        </span>`;


    document.getElementById(
        "example"
    ).innerHTML =
        `<span class="loading">
            Loading...
        </span>`;


    currentWord = query;

    currentAudio = null;

    loadDictionaryInformation(query);

    resetTimer();
}


/* ---------------------------------------------------------
   A-Z FILTER
--------------------------------------------------------- */

function buildAlphabet() {

    const alphabet =
        document.getElementById(
            "alphabet"
        );

    const allButton =
        document.createElement("button");

    allButton.textContent = "All";

    allButton.classList.add("active");

    allButton.onclick = () => {

        filteredWords = words;

        currentIndex = 0;

        setActiveAlphabet(allButton);

        showWord(0);

        resetTimer();
    };

    alphabet.appendChild(allButton);


    for (
        let code = 65;
        code <= 90;
        code++
    ) {

        const letter =
            String.fromCharCode(code);

        const button =
            document.createElement("button");

        button.textContent =
            letter;

        button.onclick = () => {

            filteredWords =
                words.filter(item =>
                    item.word
                        .trim()
                        .toUpperCase()
                        .startsWith(letter)
                );

            setActiveAlphabet(button);

            if (filteredWords.length > 0) {

                showWord(0);

            } else {

                document.getElementById(
                    "word"
                ).textContent =
                    `No words starting with ${letter}`;

                document.getElementById(
                    "definition"
                ).innerHTML = "";

                document.getElementById(
                    "hindi"
                ).textContent = "";

                document.getElementById(
                    "example"
                ).textContent = "";

                document.getElementById(
                    "grammar"
                ).innerHTML = "";

                document.getElementById(
                    "phonetic"
                ).textContent = "";
            }

            resetTimer();
        };

        alphabet.appendChild(button);
    }
}


/* ---------------------------------------------------------
   ACTIVE ALPHABET BUTTON
--------------------------------------------------------- */

function setActiveAlphabet(activeButton) {

    document
        .querySelectorAll(".alphabet button")
        .forEach(button =>
            button.classList.remove("active")
        );

    activeButton.classList.add("active");
}


/* ---------------------------------------------------------
   COUNT
--------------------------------------------------------- */

function updateCount() {

    const total =
        filteredWords.length;

    document.getElementById(
        "count"
    ).textContent =
        total
            ? `${currentIndex + 1} of ${total} words`
            : "0 words";
}


/* ---------------------------------------------------------
   TIMER
--------------------------------------------------------- */

function startTimer() {

    setInterval(() => {

        secondsRemaining--;

        if (secondsRemaining <= 0) {

            secondsRemaining = 30;

            if (filteredWords.length) {
                newWord();
            }
        }

        updateTimer();

    }, 1000);

    updateTimer();
}


function resetTimer() {

    secondsRemaining = 30;

    updateTimer();
}


function updateTimer() {

    document.getElementById(
        "timer"
    ).textContent =
        `Next word in ${secondsRemaining}s`;
}


/* ---------------------------------------------------------
   ESCAPE HTML
--------------------------------------------------------- */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>
