<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock & Learn Pro</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#fff;max-width:800px;width:100%;border-radius:28px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.badge{display:inline-block;background:#eef2ff;color:#4338ca;padding:6px 12px;border-radius:999px;font-weight:600}
.word{font-size:clamp(42px,8vw,84px);font-weight:800;margin:18px 0 8px}
.pos{color:#4f46e5;font-weight:700}
.meaning{font-size:1.3rem;margin-top:18px}
.hindi{margin-top:10px;font-size:1.1rem}
.example{margin-top:20px;background:#f8faff;padding:18px;border-left:4px solid #4f46e5;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button{border:none;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#e5e7eb}
.stats{margin-top:18px;color:#6b7280}
</style>
</head>
<body>
<div class="card">
<div class="badge">📘 Unlock & Learn Pro</div>
<div id="content"></div>
<div class="row">
<button class="primary" onclick="nextWord()">Next Word</button>
<button class="secondary" onclick="speakWord()">🔊 Pronounce</button>
<button class="secondary" onclick="toggleMeaning()">🙈 Hide/Show Meaning</button>
</div>
<div class="stats" id="stats"></div>
</div>
<script>
const words=[
["Pragmatic","adjective","Practical and focused on what works.","व्यावहारिक","We need a pragmatic solution."],
["Obfuscate","verb","To make something difficult to understand.","अस्पष्ट करना","The wording seemed to obfuscate the issue."],
["Resilient","adjective","Able to recover quickly from difficulty.","लचीला / दृढ़","The team remained resilient."],
["Astute","adjective","Very perceptive and clever.","चतुर","She made an astute observation."],
["Meticulous","adjective","Very careful and precise.","सूक्ष्म और सावधान","He was meticulous in his review."],
["Ubiquitous","adjective","Present everywhere.","सर्वव्यापी","Smartphones are ubiquitous today."],
["Tenacious","adjective","Persistent and determined.","दृढ़","Her tenacious effort paid off."],
["Eloquent","adjective","Fluent and persuasive.","वाक्पटु","She gave an eloquent speech."]
];
let current=0, hidden=false;
let learned=Number(localStorage.getItem("learned")||0);

function dayIndex(){
 const start=new Date("2025-01-01");
 const now=new Date();
 return Math.floor((now-start)/(1000*60*60*24));
}
function render(){
 const w=words[current];
 document.getElementById("content").innerHTML=`
 <div class="word">${w[0]}</div>
 <div class="pos">${w[1]}</div>
 <div class="meaning">${hidden?"••••••••":w[2]}</div>
 <div class="hindi">${hidden?"":("🇮🇳 "+w[3])}</div>
 <div class="example">${hidden?"Meaning hidden":("💬 "+w[4])}</div>`;
 document.getElementById("stats").textContent=`Words explored: ${learned}`;
}
function nextWord(){
 current=Math.floor(Math.random()*words.length);
 learned++;
 localStorage.setItem("learned", learned);
 render();
}
function toggleMeaning(){hidden=!hidden;render();}
function speakWord(){
 speechSynthesis.speak(new SpeechSynthesisUtterance(words[current][0]));
}
current=dayIndex()%words.length; // word of the day
render();
</script>
</body>
</html>
